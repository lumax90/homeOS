name: Publish Home container

on:
  workflow_dispatch:
    inputs:
      full_verification:
        description: "Run the long multi-system Selkies comparison suite"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/publish-container.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Build.props"
      - "package*.json"
      - "server/**"
      - "web/**"
      - "tools/**"
      - "deploy/native/**"
      - "deploy/selkies/**"
      - "deploy/media/**"
      - "deploy/psp/**"
      - "deploy/handheld/**"
      - "deploy/casaos/prepare-data.sh"
      - "deploy/casaos/managed-updater.py"
      - "docs/licenses/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: home-container-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the backend test SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"

      - name: Verify update admission and backup recovery
        run: dotnet test tests/HomeServer.Tests/HomeServer.Tests.csproj -c Release --filter 'FullyQualifiedName~ContainerUpdateTests|FullyQualifiedName~ManagedContainerUpdateTests|FullyQualifiedName~BackupTests' --logger 'trx;LogFileName=container-updates.trx' --results-directory "$RUNNER_TEMP/home-backend-verification" --nologo

      - name: Verify approval bridge without Docker or network access
        run: python3 tests/unit/test_managed_updater.py

      - name: Verify PSP source closure and game-removal boundaries
        run: |
          python3 tests/unit/test_psp_source.py
          dotnet test tests/HomeServer.Tests/HomeServer.Tests.csproj -c Release --filter 'FullyQualifiedName~PspImportAndRemovalTests|FullyQualifiedName~ConfirmedUninstallApi|FullyQualifiedName~ManagedWebUninstall|FullyQualifiedName~GamingSupportedSystemsTests|FullyQualifiedName~SupportedSystemsApi' --nologo

      - name: Locate hosted FFmpeg verification tools
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          printf 'HOME_TEST_FFMPEG=%s\nHOME_TEST_FFPROBE=%s\n' "$(command -v ffmpeg)" "$(command -v ffprobe)" >> "$GITHUB_ENV"
          ffmpeg -version

      - name: Verify radio visual media and permission boundaries
        run: |
          dotnet test tests/HomeServer.Tests/HomeServer.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~RadioVisualTests|FullyQualifiedName~RadioTests|FullyQualifiedName~MusicExperienceTests' --logger 'trx;LogFileName=radio-visual.trx' --results-directory "$RUNNER_TEMP/home-backend-verification" --nologo

      - name: Verify native stream selection and save contract
        run: dotnet test tests/HomeServer.Tests/HomeServer.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~NativeSelkiesTests|FullyQualifiedName~NativeRuntimeAdapterTests|FullyQualifiedName~NativeHostIntegrationTests|FullyQualifiedName~NativeInputBufferTests' --logger 'trx;LogFileName=selkies-boundaries.trx' --results-directory "$RUNNER_TEMP/home-backend-verification" --nologo

      - name: Verify film and live playback planning and lifecycle
        run: dotnet test tests/HomeServer.Tests/HomeServer.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~PlaybackEfficiencyTests|FullyQualifiedName~DolbyVisionAnalysisTests|FullyQualifiedName~MediaRuntimeCompatibilityTests|FullyQualifiedName~PlaybackWindowTests|FullyQualifiedName~PlaybackLifecycleTests|FullyQualifiedName~PlaybackQuotaTests|FullyQualifiedName~LiveStabilityTests|FullyQualifiedName~LiveTvProtocolTests|FullyQualifiedName~LiveTvExperienceTests' --logger 'trx;LogFileName=playback-live.trx' --results-directory "$RUNNER_TEMP/home-backend-verification" --nologo

      - name: Verify new catalogue and import-location data boundaries
        run: dotnet test tests/HomeServer.Tests/HomeServer.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~CatalogCardsTests|FullyQualifiedName~DownloadImportDirectoryTests|FullyQualifiedName~ContentMediaTests' --logger 'trx;LogFileName=catalogue-import.trx' --results-directory "$RUNNER_TEMP/home-backend-verification" --nologo

      - name: Read release identity
        id: release
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'A stable application version is required.' >&2; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The Git tag must match package.json.' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'version=%s\nimage=%s\ntag=%s:sha-%s\n' "$version" "$image" "$image" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate an existing verified candidate
        id: candidate
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            docker pull "$RELEASE_IMAGE"
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build x64 image and verify native runtime lock
        if: steps.candidate.outputs.reuse != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          load: true
          tags: ${{ steps.release.outputs.tag }}
          build-args: HOME_SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=home-linux-amd64
          cache-to: type=gha,scope=home-linux-amd64,mode=max,ignore-error=true

      - name: Verify unattended installation and data preservation
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: bash tools/verification/verify-container-install.sh "$RELEASE_IMAGE" "$RUNNER_TEMP/home-container-verification"

      - name: Verify browser playback decisions
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src" --workdir /src \
            node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205 \
            npm ci --ignore-scripts
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" --workdir /src \
            node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205 \
            node --test tests/unit/supported-systems.test.mjs tests/unit/psp-and-removal.test.mjs tests/unit/container-updates.test.ts tests/unit/playback-transport.test.ts tests/unit/playback-capabilities.test.ts tests/unit/movie-hls-config.test.ts tests/unit/catalog-groups.test.ts tests/unit/content-media.test.ts tests/unit/media-runtime.test.mjs tests/unit/live-tv.test.ts tests/unit/live-recovery.test.ts tests/unit/radio-visual.test.ts tests/unit/music-experience.test.ts tests/unit/native-streaming.test.ts

      - name: Verify pinned media runtime and movie/live protocol boundaries
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: python3 tools/verification/verify-media-runtime.py "$RELEASE_IMAGE" "$RUNNER_TEMP/home-media-verification"

      - name: Verify automatic replacement and busy deferral
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: python3 tools/verification/verify-auto-update.py "$RELEASE_IMAGE" "$RUNNER_TEMP/home-auto-update-verification"

      - name: Verify optional Selkies streaming and cross-backend saves
        if: github.event_name == 'workflow_dispatch' && inputs.full_verification
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: |
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/home-stream-protocol-env"
          "$RUNNER_TEMP/home-stream-protocol-env/bin/pip" install aiortc==1.15.0 aiohttp==3.14.5
          python3 tools/verification/verify-selkies-container.py "$RELEASE_IMAGE" "$RUNNER_TEMP/home-selkies-verification" --python "$RUNNER_TEMP/home-stream-protocol-env/bin/python"

      - name: Require complete media and PSP corresponding source before publication
        run: |
          python3 - <<'PY'
          import json
          pin = json.load(open('deploy/media/runtime.json'))
          assert pin['distribution']['correspondingSourceVerified'], 'Media runtime source/licence publication gate remains open.'
          psp = json.load(open('deploy/psp/runtime.json'))
          assert psp['distribution']['sourceVerified'], 'PSP corresponding-source/notices publication gate remains open.'
          assert psp['distribution']['runtimeVerified'], 'PSP runtime publication qualification remains open.'
          handheld = json.load(open('deploy/handheld/runtime.json'))
          assert handheld['distribution']['sourceVerified'], 'DS/3DS corresponding-source publication gate remains open.'
          assert handheld['distribution']['runtimeVerified'], 'DS/3DS runtime publication gate remains open.'
          PY

      - name: Publish candidate and promote the verified stable channel
        id: publish
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$RELEASE_IMAGE")" = "$GITHUB_SHA"
          docker push --platform linux/amd64 "$RELEASE_IMAGE"
          git fetch --no-tags --depth=1 origin main
          current="$(git rev-parse FETCH_HEAD)"
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF_TYPE" == tag ]] && git diff --quiet "$GITHUB_SHA" "$current" -- Dockerfile .dockerignore Directory.Build.props 'package*.json' server web tools deploy/native deploy/selkies deploy/media deploy/psp deploy/handheld deploy/casaos/prepare-data.sh deploy/casaos/managed-updater.py docs/licenses tests .github/workflows/publish-container.yml; then
            node tools/verify-container-channel.mjs "$IMAGE" "$VERSION"
            if ! docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
              docker tag "$RELEASE_IMAGE" "$IMAGE:$VERSION"
              docker push --platform linux/amd64 "$IMAGE:$VERSION"
            fi
            docker tag "$RELEASE_IMAGE" "$IMAGE:stable"
            docker push --platform linux/amd64 "$IMAGE:stable"
            printf 'Promoted verified source `%s` to `%s:stable`.\n' "$GITHUB_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Verified candidate `%s`; stable remains on the current main revision.\n' "$RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record registry digest
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Save verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-verification
          path: |
            ${{ runner.temp }}/home-container-verification/reports/*.json
            ${{ runner.temp }}/home-container-verification/reports/*.log
            ${{ runner.temp }}/home-auto-update-verification/*.json
            ${{ runner.temp }}/home-auto-update-verification/*.log
            ${{ runner.temp }}/home-backend-verification/*.trx
            ${{ runner.temp }}/home-playback-verification/result.json
            ${{ runner.temp }}/home-playback-verification/container.log
            ${{ runner.temp }}/home-live-verification/result.json
            ${{ runner.temp }}/home-live-verification/container.log
            ${{ runner.temp }}/home-media-verification/result.json
            ${{ runner.temp }}/home-media-verification/runtime-version.txt
            ${{ runner.temp }}/home-media-verification/movie/result.json
            ${{ runner.temp }}/home-media-verification/movie/container.log
            ${{ runner.temp }}/home-media-verification/movie/timeout-state.json
            ${{ runner.temp }}/home-media-verification/live/result.json
            ${{ runner.temp }}/home-media-verification/live/container.log
            ${{ runner.temp }}/home-selkies-verification/*.json
            ${{ runner.temp }}/home-selkies-verification/*.log
          if-no-files-found: ignore
          retention-days: 14

name: Publish Home container

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/publish-container.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Build.props"
      - "package*.json"
      - "server/**"
      - "web/**"
      - "tools/**"
      - "deploy/native/**"
      - "deploy/casaos/prepare-data.sh"
      - "docs/licenses/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: home-container-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the backend test SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"

      - name: Verify update admission and backup recovery
        run: dotnet test tests/HomeServer.Tests/HomeServer.Tests.csproj -c Release --filter 'FullyQualifiedName~ContainerUpdateTests|FullyQualifiedName~BackupTests' --logger 'trx;LogFileName=container-updates.trx' --results-directory "$RUNNER_TEMP/home-backend-verification" --nologo

      - name: Read release identity
        id: release
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'A stable application version is required.' >&2; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The Git tag must match package.json.' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'version=%s\nimage=%s\ntag=%s:sha-%s\n' "$version" "$image" "$image" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate an existing verified candidate
        id: candidate
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            docker pull "$RELEASE_IMAGE"
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build x64 image and native proof
        if: steps.candidate.outputs.reuse != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          load: true
          tags: ${{ steps.release.outputs.tag }}
          build-args: HOME_SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=home-linux-amd64
          cache-to: type=gha,scope=home-linux-amd64,mode=max,ignore-error=true

      - name: Verify unattended installation and data preservation
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: bash tools/verification/verify-container-install.sh "$RELEASE_IMAGE" "$RUNNER_TEMP/home-container-verification"

      - name: Verify automatic replacement and busy deferral
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: python3 tools/verification/verify-auto-update.py "$RELEASE_IMAGE" "$RUNNER_TEMP/home-auto-update-verification"

      - name: Publish candidate and promote the verified stable channel
        id: publish
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$RELEASE_IMAGE")" = "$GITHUB_SHA"
          docker push --platform linux/amd64 "$RELEASE_IMAGE"
          git fetch --no-tags --depth=1 origin main
          current="$(git rev-parse FETCH_HEAD)"
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF_TYPE" == tag ]] && git diff --quiet "$GITHUB_SHA" "$current" -- Dockerfile .dockerignore Directory.Build.props 'package*.json' server web tools deploy/native deploy/casaos/prepare-data.sh docs/licenses tests .github/workflows/publish-container.yml; then
            node tools/verify-container-channel.mjs "$IMAGE" "$VERSION"
            if ! docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
              docker tag "$RELEASE_IMAGE" "$IMAGE:$VERSION"
              docker push --platform linux/amd64 "$IMAGE:$VERSION"
            fi
            docker tag "$RELEASE_IMAGE" "$IMAGE:stable"
            docker push --platform linux/amd64 "$IMAGE:stable"
            printf 'Promoted verified source `%s` to `%s:stable`.\n' "$GITHUB_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Verified candidate `%s`; stable remains on the current main revision.\n' "$RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record registry digest
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Save verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-verification
          path: |
            ${{ runner.temp }}/home-container-verification/reports/*.json
            ${{ runner.temp }}/home-container-verification/reports/*.log
            ${{ runner.temp }}/home-auto-update-verification/*.json
            ${{ runner.temp }}/home-auto-update-verification/*.log
            ${{ runner.temp }}/home-backend-verification/*.trx
          if-no-files-found: ignore
          retention-days: 14

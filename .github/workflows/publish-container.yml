name: Publish Home container

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: home-container-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read release identity
        id: release
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'A stable application version is required.' >&2; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The Git tag must match package.json.' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'version=%s\nimage=%s\ntag=%s:%s\n' "$version" "$image" "$image" "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve an already published release
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            echo 'This release tag already exists. Publish a new application version rather than replacing it.' >&2
            exit 1
          fi

      - name: Build x64 image and native proof
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          load: true
          tags: ${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=home-linux-amd64

      - name: Verify unattended installation and data preservation
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
        run: bash tools/verification/verify-container-install.sh "$RELEASE_IMAGE" "$RUNNER_TEMP/home-container-verification"

      - name: Publish verified image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.tag }}
            ${{ steps.release.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=min
          cache-to: type=gha,scope=home-linux-amd64,mode=max,ignore-error=true

      - name: Record registry digest
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.tag }}
          RELEASE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Image: `%s`\n\nDigest: `%s`\n\nFirst publication requires Public package visibility before anonymous CasaOS pulls.\n' "$RELEASE_IMAGE" "$RELEASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Save verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-verification
          path: |
            ${{ runner.temp }}/home-container-verification/reports/*.json
            ${{ runner.temp }}/home-container-verification/reports/*.log
          if-no-files-found: ignore
          retention-days: 14

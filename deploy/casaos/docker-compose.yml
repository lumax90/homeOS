name: home
services:
  home:
    container_name: home
    image: ghcr.io/lumax90/homeos:0.43.0
    pull_policy: missing
    depends_on:
      home-data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    user: "1654:1654"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    ports:
      - target: 8080
        published: "5080"
        protocol: tcp
      - target: 62405
        published: "62405"
        protocol: udp
      - target: 62405
        published: "62405"
        protocol: tcp
    environment:
      TZ: Europe/Istanbul
      HOME: /data
      XDG_CACHE_HOME: /data/cache
      MESA_SHADER_CACHE_MAX_SIZE: 128M
    volumes:
      - type: bind
        source: /DATA/AppData/home/data
        target: /data
        bind:
          create_host_path: true
    stop_grace_period: 3m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_US: Home web interface and API
            tr_TR: Home arayüzü ve API
        - container: "62405"
          description:
            en_US: Encrypted game streaming (TCP and UDP, keep the same host port)
            tr_TR: Şifreli oyun yayını (TCP ve UDP; sunucuda aynı port)
      volumes:
        - container: /data
          description:
            en_US: Persistent accounts, library, downloads, ROMs and saves
            tr_TR: Kalıcı hesaplar, kütüphane, indirmeler, ROM ve kayıtlar
  home-data-init:
    container_name: home-data-init
    image: ghcr.io/lumax90/homeos:0.43.0
    pull_policy: missing
    restart: on-failure:3
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "/app/prepare-data.sh"]
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: /DATA/AppData/home/data
        target: /data
        bind:
          create_host_path: true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    x-casaos:
      volumes:
        - container: /data
          description:
            en_US: Use the same Host directory as the Home service; prepares first-install ownership.
            tr_TR: Home servisiyle aynı Host klasörünü kullanın; ilk kurulum izinlerini hazırlar.
x-casaos:
  id: local.home.media
  architectures: [amd64]
  main: home
  title:
    en_US: Home
  description:
    en_US: Personal media, Live TV and headless server-run games for your home network.
    tr_TR: Ev ağındaki cihazlar için kişisel medya, Canlı TV ve sunucuda çalışan oyunlar.
  tagline:
    en_US: Your media, on your server.
    tr_TR: Medyan, kendi sunucunda.
  developer: Home
  author: Home
  category: Media
  icon: ""
  thumbnail: ""
  scheme: http
  index: /
  port_map: "5080"

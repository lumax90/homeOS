name: home
services:
  home:
    container_name: home
    image: ghcr.io/lumax90/homeos:stable
    pull_policy: missing
    depends_on:
      home-data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    user: "1654:1654"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    ports:
      - target: 8080
        published: "5080"
        protocol: tcp
      - target: 62405
        published: "62405"
        protocol: udp
      - target: 62405
        published: "62405"
        protocol: tcp
    environment:
      TZ: Europe/Istanbul
      HOME: /data
      XDG_CACHE_HOME: /data/cache
      MESA_SHADER_CACHE_MAX_SIZE: 128M
      Home__Updates__Managed: "true"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: home
      com.centurylinklabs.watchtower.lifecycle.pre-update: /app/HomeServer.Api --container-update-prepare
      com.centurylinklabs.watchtower.lifecycle.pre-update-timeout: "3"
      com.centurylinklabs.watchtower.lifecycle.post-update: /app/HomeServer.Api --container-update-complete
      com.centurylinklabs.watchtower.lifecycle.post-update-timeout: "3"
      com.centurylinklabs.watchtower.lifecycle.post-check: /app/HomeServer.Api --container-update-cancel
    volumes:
      - type: bind
        source: /DATA/AppData/home/data
        target: /data
        bind:
          create_host_path: true
    stop_grace_period: 3m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_US: Home web interface and API
            tr_TR: Home arayüzü ve API
        - container: "62405"
          description:
            en_US: Encrypted game streaming (TCP and UDP, keep the same host port)
            tr_TR: Şifreli oyun yayını (TCP ve UDP; sunucuda aynı port)
      volumes:
        - container: /data
          description:
            en_US: Persistent accounts, library, downloads, ROMs and saves
            tr_TR: Kalıcı hesaplar, kütüphane, indirmeler, ROM ve kayıtlar
  home-data-init:
    container_name: home-data-init
    image: ghcr.io/lumax90/homeos:stable
    pull_policy: missing
    restart: on-failure:3
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "/app/prepare-data.sh"]
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: /DATA/AppData/home/data
        target: /data
        bind:
          create_host_path: true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    x-casaos:
      volumes:
        - container: /data
          description:
            en_US: Use the same Host directory as the Home service; prepares first-install ownership.
            tr_TR: Home servisiyle aynı Host klasörünü kullanın; ilk kurulum izinlerini hazırlar.
  home-updater:
    container_name: home-updater
    image: ghcr.io/lumax90/homeos:stable
    pull_policy: missing
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/usr/bin/python3", "/app/managed-updater.py"]
    command: []
    environment:
      HOME_UPDATE_CONTAINER: home
      HOME_UPDATE_SCOPE: home
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "import os; assert b'managed-updater.py' in open('/proc/1/cmdline','rb').read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: home
    tmpfs:
      - /tmp:rw,nosuid,size=32m
      - /data:rw,nosuid,size=1m
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    x-casaos:
      volumes:
        - container: /var/run/docker.sock
          description:
            en_US: Docker control for the scoped Home updater.
            tr_TR: Home güncelleyicisinin Docker bağlantısı.
x-casaos:
  id: local.home.media
  architectures: [amd64]
  main: home
  title:
    en_US: Home
  description:
    en_US: Personal media, Live TV and headless server-run games for your home network.
    tr_TR: Ev ağındaki cihazlar için kişisel medya, Canlı TV ve sunucuda çalışan oyunlar.
  tagline:
    en_US: Your media, on your server.
    tr_TR: Medyan, kendi sunucunda.
  developer: Home
  author: Home
  category: Media
  icon: ""
  thumbnail: ""
  scheme: http
  index: /
  port_map: "5080"

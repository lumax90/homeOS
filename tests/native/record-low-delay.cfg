# Isolated codec tuning experiment. Not a normal runtime profile until measurements and audio checks pass.
vcodec = "libx264"
acodec = "libopus"
format = "mpegts"
pix_fmt = "yuv420p"
sample_rate = "48000"
audio_enable = "true"
scale_factor = "1"
threads = "1"
frame_drop_ratio = "1"
video_preset = "ultrafast"
video_tune = "zerolatency"
video_profile = "baseline"
video_g = "30"
video_bf = "0"
audio_application = "lowdelay"
audio_frame_duration = "2.5"
audio_bit_rate = "64000"
video_bit_rate = "600000"
